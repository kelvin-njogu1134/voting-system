<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartVote Kenya - Admin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">SmartVote Kenya</div>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="results.html">Results</a></li>
            <li><a href="#" id="adminLogout" style="display:none;">Logout</a></li>
        </ul>
    </nav>

    <main class="container">
        <div id="adminLoginSection">
            <h2>Admin Login</h2>
            <form id="adminLoginForm">
                <div class="form-group">
                    <label for="adminEmail">Email</label>
                    <input type="email" id="adminEmail" value="devkischool@gmail.com" readonly>
                </div>
                <div class="form-group">
                    <label for="adminPassword">Password</label>
                    <input type="password" id="adminPassword" required>
                </div>
                <button type="submit" class="btn">Login</button>
            </form>
        </div>

        <div id="adminPanel" style="display:none;">
            <h2>Admin Panel</h2>
            <div class="stats-container">
                <div class="stat-card">Total Users: <span id="adminTotalUsers">0</span></div>
                <div class="stat-card">Ballots Cast: <span id="adminTotalVotes">0</span></div>
            </div>
            <h3>Votes per Candidate</h3>
            <div id="adminVotesContainer">
                <!-- Per-position lists will be generated here -->
            </div>
            <div class="admin-actions">
                <button id="resetVotesBtn" class="btn">Reset All Votes</button>
                <button id="deleteUsersBtn" class="btn">Delete All Users</button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
