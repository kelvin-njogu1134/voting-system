<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartVote Kenya - Live Results</title>
    <link rel="stylesheet" href="style.css">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="logo">SmartVote Kenya</div>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="register.html">Register</a></li>
            <li><a href="login.html">Login</a></li>
            <li><a href="results.html">Results</a></li>
            <li><a href="admin.html">Admin</a></li>
        </ul>
    </nav>

    <main class="container">
        <h2>Live Voting Results</h2>
        <div class="stats-container">
            <div class="stat-card">Registered Voters: <span id="totalUsers">0</span></div>
            <div class="stat-card">Ballots Cast: <span id="totalVotes">0</span></div>
            <div class="stat-card">Remaining Voters: <span id="remainingVoters">0</span></div>
        </div>

        <div class="form-group">
            <label for="positionSelect">Select Position:</label>
            <select id="positionSelect">
                <option value="president">President</option>
                <option value="governor">Governor</option>
                <option value="senator">Senator</option>
                <option value="mp">Member of Parliament</option>
                <option value="mca">MCA</option>
                <option value="womenRep">Women Representative</option>
            </select>
        </div>

        <div class="chart-container">
            <canvas id="votesChart"></canvas>
        </div>

        <div id="progressBars" class="progress-bars">
            <!-- Progress bars for all positions will be dynamically generated -->
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
