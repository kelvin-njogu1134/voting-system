<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartVote Kenya - Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">SmartVote Kenya</div>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="results.html">Results</a></li>
            <li><a href="#" id="logout">Logout</a></li>
        </ul>
    </nav>

    <main class="container">
        <h2>Select Your Voting Location</h2>
        <form id="locationForm">
            <div class="form-group">
                <label for="county">County</label>
                <select id="county" required>
                    <option value="">-- Select County --</option>
                </select>
            </div>
            <div class="form-group">
                <label for="subcounty">Subcounty</label>
                <select id="subcounty" required disabled>
                    <option value="">-- Select Subcounty --</option>
                </select>
            </div>
            <div class="form-group">
                <label for="ward">Ward</label>
                <select id="ward" required disabled>
                    <option value="">-- Select Ward --</option>
                </select>
            </div>
            <div class="form-group">
                <label for="location">Location</label>
                <select id="location" required disabled>
                    <option value="">-- Select Location --</option>
                </select>
            </div>
            <div class="form-group">
                <label for="sublocation">Sublocation</label>
                <select id="sublocation" required disabled>
                    <option value="">-- Select Sublocation --</option>
                </select>
            </div>
            <button type="submit" class="btn" id="proceedToVote" disabled>Proceed to Vote</button>
        </form>
    </main>

    <script src="script.js"></script>
</body>
</html>
